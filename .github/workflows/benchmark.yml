name: Benchmark

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCHMARK_CI: github-actions
      BENCHMARK_RUNNER_CLASS: ubuntu-latest
      BENCHMARK_PYTHON_VERSION: "3.14"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Run performance benchmarks
        run: |
          mkdir -p .benchmarks
          uv run pytest tests/test_benchmark.py -v -s -m slow
      - name: Display benchmark results
        if: always()
        run: |
          echo "=== Benchmark Results ==="
          cat .benchmarks/benchmark.json
          echo "========================="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: .benchmarks
          include-hidden-files: true
